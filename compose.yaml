# Two stacks, one file — and they share NO data.
#
#   docker compose up -d                 DEV dependencies: Postgres `mydb_dev` (5544) + MinIO
#                                        (9100/9101), app on the host. Disposable by design.
#   docker compose --profile tracing up -d
#                                        ...plus the DEV trace backend, Phoenix (6006).
#   docker compose --profile full up     PRODUCTION: the whole app on its OWN Postgres (5546), its
#                                        OWN MinIO (9102/9103) and its OWN Phoenix (6016). This is
#                                        the stack holding real financial records — and their traces.
#
# The split is physical, not by convention: `db-prod`, `minio-prod` and `phoenix-prod` use their
# own named volumes, so `docker compose down -v` (which deletes volumes) on the default profile
# CANNOT reach production data. Removing production data takes naming that stack explicitly.
#
#   docker compose down                             stop dev, keep data
#   docker compose down -v                          stop dev, DESTROY dev data (safe: dev only)
#   docker compose --profile full down              stop production, keep data  ← use this one
#   docker compose --profile full down -v           DESTROYS REAL FINANCIAL DATA. Back up first;
#                                                   see "Backing up" in AGENTS.md.
#
# Services carrying `profiles:` do not start without the profile.

name: cameron-ai

services:
  # ── Default profile: DEV dependencies. Disposable. ─────────────────────────────────────────────

  db:
    image: postgres:17-alpine
    container_name: cameron-ai-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      # `mydb_dev`, not `mydb`: the dev database is the one that gets wiped, reseeded and
      # experimented on. Production lives in `db-prod` below.
      POSTGRES_DB: ${POSTGRES_DB:-mydb_dev}
    ports:
      - "${POSTGRES_PORT:-5544}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-mydb_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: cameron-ai-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "${S3_API_PORT:-9100}:9000" # S3 API
      - "${S3_CONSOLE_PORT:-9101}:9001" # MinIO Console (Web UI)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  createbuckets:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set localminio http://minio:9000 ${S3_ACCESS_KEY_ID:-minioadmin} ${S3_SECRET_ACCESS_KEY:-minioadmin};
      /usr/bin/mc mb localminio/${S3_BUCKET_NAME:-uploads} --ignore-existing;
      /usr/bin/mc anonymous set download localminio/${S3_BUCKET_NAME:-uploads};
      exit 0;
      "

  # Dev trace backend, `--profile tracing` only. Point the host app at it with
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:6006 (see docs/OBSERVABILITY.md).
  phoenix:
    profiles: [tracing]
    image: arizephoenix/phoenix:version-20.23.0-nonroot
    container_name: cameron-ai-phoenix
    environment:
      PHOENIX_TELEMETRY_ENABLED: "false"
    ports:
      # Loopback only: Phoenix has no login, and traces describe your finances.
      - "127.0.0.1:${PHOENIX_PORT:-6006}:6006"
    volumes:
      # The nonroot image can only write under its own home, so the volume mounts there.
      - phoenix_data:/home/nonroot

  # ── `--profile full` only: PRODUCTION. Real financial data. ────────────────────────────────────

  # Separate service and separate volume from `db` above — that separation is the whole point, so
  # a teardown of the dev stack cannot reach these rows. Its port differs too, so a host-side tool
  # pointed at 5544 reaches dev, never production.
  db-prod:
    profiles: [full]
    image: postgres:17-alpine
    container_name: cameron-ai-db-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_PROD_DB:-mydb}
    ports:
      - "${POSTGRES_PROD_PORT:-5546}:5432"
    volumes:
      - prod_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_PROD_DB:-mydb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Uploads are bank exports and receipts — financial data by the same standard as the rows they
  # produce, so the object store is split for the same reason the database is.
  minio-prod:
    profiles: [full]
    image: quay.io/minio/minio:latest
    container_name: cameron-ai-minio-prod
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "${S3_PROD_API_PORT:-9102}:9000"
      - "${S3_PROD_CONSOLE_PORT:-9103}:9001"
    volumes:
      - prod_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  createbuckets-prod:
    profiles: [full]
    image: quay.io/minio/mc:latest
    depends_on:
      minio-prod:
        condition: service_healthy
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set localminio http://minio-prod:9000 ${S3_ACCESS_KEY_ID:-minioadmin} ${S3_SECRET_ACCESS_KEY:-minioadmin};
      /usr/bin/mc mb localminio/${S3_BUCKET_NAME:-uploads} --ignore-existing;
      /usr/bin/mc anonymous set download localminio/${S3_BUCKET_NAME:-uploads};
      exit 0;
      "

  # Production traces: the same split as the database, so a dev teardown cannot reach them.
  phoenix-prod:
    profiles: [full]
    image: arizephoenix/phoenix:version-20.23.0-nonroot
    container_name: cameron-ai-phoenix-prod
    environment:
      PHOENIX_TELEMETRY_ENABLED: "false"
    ports:
      - "127.0.0.1:${PHOENIX_PROD_PORT:-6016}:6006"
    volumes:
      - prod_phoenix_data:/home/nonroot
    restart: unless-stopped

  # Applies pending migrations, then exits. Its own service (and its own build stage) because
  # drizzle-kit is a devDependency that the runtime image deliberately does not carry.
  migrate:
    profiles: [full]
    build:
      context: .
      target: migrate
    container_name: cameron-ai-migrate
    depends_on:
      db-prod:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db-prod:5432/${POSTGRES_PROD_DB:-mydb}
    restart: on-failure

  web:
    profiles: [full]
    build:
      context: .
      target: runner
    container_name: cameron-ai-web
    depends_on:
      # Boots against a migrated schema or not at all.
      migrate:
        condition: service_completed_successfully
      minio-prod:
        condition: service_healthy
    ports:
      - "${PORT:-3100}:3100"
    environment:
      # Service names, not localhost — inside the network, localhost is the container itself.
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db-prod:5432/${POSTGRES_PROD_DB:-mydb}

      # The two halves of the split: S3_ENDPOINT is how the SERVER reaches MinIO, S3_PUBLIC_URL is
      # what gets handed to the BROWSER in an upload's returned link. Same store, different routes.
      S3_ENDPOINT: http://minio-prod:9000
      S3_PUBLIC_URL: http://localhost:${S3_PROD_API_PORT:-9102}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-uploads}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: "true"

      # Your keys, read from the environment or .env — never baked into the image.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}

      # Traces go to this stack's own Phoenix, metadata only. PROD_-prefixed so a host-dev value in
      # .env (e.g. localhost:6006) never redirects production traces. See docs/OBSERVABILITY.md.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${PROD_OTEL_EXPORTER_OTLP_ENDPOINT:-http://phoenix-prod:6006}
      OTEL_EXPORTER_OTLP_HEADERS: ${PROD_OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SDK_DISABLED: ${PROD_OTEL_SDK_DISABLED:-false}
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: ${PROD_OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT:-false}
    restart: unless-stopped

volumes:
  # Dev — disposable.
  db_data:
  minio_data:
  phoenix_data:
  # Production — real financial records and their traces. Only a `--profile full down -v` removes these.
  prod_db_data:
  prod_minio_data:
  prod_phoenix_data:
