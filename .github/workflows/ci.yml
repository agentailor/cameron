name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm before Node, so setup-node can use the pnpm cache.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Unit tests are offline by design — no Postgres service needed.
      - run: pnpm test

      - run: npx tsc --noEmit

      # The root tsconfig's `include` is "**/*.ts", which does not match the eval tree's .mts.
      - run: pnpm typecheck:eval

      # Nothing checked formatting before, so drift was only ever visible locally.
      - run: pnpm format:check
